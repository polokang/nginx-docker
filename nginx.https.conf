events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── TLS 安全默认 ────────────────────────────────────────────────────
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;

    # ─────────────────────────────────────────────────────────────────────
    # 阶段 2：HTTPS 终结 + HTTP 自动跳转
    #
    # 仅当 ./certs/live/<domain>/{fullchain,privkey}.pem 已经存在时启用
    # 这份配置。启用方式：
    #   1) cp nginx.https.conf nginx.conf
    #   2) docker build -t <你的镜像>:latest .
    #   3) docker compose up -d
    #
    # 注：80 端口仍保留 ACME 路径，让续期可以无停机进行。
    # ─────────────────────────────────────────────────────────────────────

    # ── HTTP：处理 ACME challenge + 其余一律 301 到 HTTPS ───────────────
    server {
        listen 80;
        server_name pro.aquareporter.com.au aquadev.aquareporter.com.au;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------
    # HTTPS: pro.aquareporter.com.au  ->  aquareporter (8888)
    # -------------------------------------------------------
    server {
        listen 443 ssl;
        http2  on;
        server_name pro.aquareporter.com.au;

        ssl_certificate     /etc/letsencrypt/live/pro.aquareporter.com.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pro.aquareporter.com.au/privkey.pem;

        location / {
            proxy_pass         http://host.docker.internal:8888;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }

    # -------------------------------------------------------
    # HTTPS: aquadev.aquareporter.com.au  ->  adminpage (8000)
    # -------------------------------------------------------
    server {
        listen 443 ssl;
        http2  on;
        server_name aquadev.aquareporter.com.au;

        ssl_certificate     /etc/letsencrypt/live/aquadev.aquareporter.com.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/aquadev.aquareporter.com.au/privkey.pem;

        location / {
            proxy_pass         http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
