events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── TLS 安全默认 ────────────────────────────────────────────────────
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;

    # ── 上传体积上限 ────────────────────────────────────────────────────
    # nginx 默认只有 1m，而生产平板拍的发货 / 备件照片普遍 3-8MB，超过就被这一层
    # 直接拒掉返回 413，请求根本到不了后端 —— AqProduction 传图报 413 就是这个原因。
    # 下游 adminpage-web 容器内的 nginx 同样是 100m，两边保持一致。
    # 真正的业务上限由 adminpage-api 的 multer 把关（单张 20MB），那一层能返回带
    # 说明的 JSON 错误，比 nginx 这个没有上下文的 413 页面好定位。
    client_max_body_size 100m;

    # ─────────────────────────────────────────────────────────────────────
    # 当前域名策略：
    #   pro.aquareporter.com.au     → HTTPS（Passkey 需要 secure context）
    #   aquadev.aquareporter.com.au → HTTP-only（内网 adminpage 不需要 TLS）
    #
    # 仅当 ./certs/live/pro.aquareporter.com.au/{fullchain,privkey}.pem 已经
    # 存在时这份配置才能启动。首次签发前先用 nginx.bootstrap.conf（或临时把
    # 443 server 块注释掉）。
    # ─────────────────────────────────────────────────────────────────────

    # ── HTTP: pro → ACME challenge + 301 到 HTTPS ───────────────────────
    server {
        listen 80;
        server_name pro.aquareporter.com.au;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------
    # HTTP: aquadev.aquareporter.com.au  ->  adminpage (8000)
    # 内网访问，不做 TLS 终结，不强制跳转 HTTPS。
    # -------------------------------------------------------
    server {
        listen 80;
        server_name aquadev.aquareporter.com.au;

        location / {
            proxy_pass         http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }

    # -------------------------------------------------------
    # HTTPS: pro.aquareporter.com.au
    #   /api/*  -> aquareporter-api (8088)
    #   /*      -> aquareporter-web (8888)
    # 让浏览器只对同源 https 端口发请求，避免 Mixed Content。
    # -------------------------------------------------------
    server {
        listen 443 ssl;
        http2  on;
        server_name pro.aquareporter.com.au;

        ssl_certificate     /etc/letsencrypt/live/pro.aquareporter.com.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pro.aquareporter.com.au/privkey.pem;

        # 后端 API
        location /api/ {
            proxy_pass         http://host.docker.internal:8088;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }

        # 前端 SPA
        location / {
            proxy_pass         http://host.docker.internal:8888;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }

    # -------------------------------------------------------
    # HTTP: www.aquareporter.dev  —— Cloudflare Tunnel 入口
    #   /api/  -> aquareporter-api (8088)
    #   /      -> aquareporter-web (8888)
    #
    # 走的是 cloudflared 出站隧道（和 admin / data 子域同一条），不是公网 443：
    # Azure NSG 的 80/443 只放行公司出口 IP，Cloudflare 回源 IP 不在白名单里，
    # 所以 www 不能用 A 记录直连，必须由隧道把请求送到本机 80。
    # 隧道路由在 Zero Trust -> Networks -> Tunnels -> adminpage ->
    # Published application routes 里配：www.aquareporter.dev ->
    # HTTP host.docker.internal:80，指到这个 server 块。
    #
    # TLS 由 Cloudflare 终结，cloudflared 到这里是明文 HTTP，所以**不要**像 pro
    # 那样 301 跳 HTTPS —— 那会跳回 Cloudflare 形成死循环。
    # -------------------------------------------------------
    server {
        listen 80;
        server_name www.aquareporter.dev;

        # 后端 API
        location /api/ {
            proxy_pass         http://host.docker.internal:8088;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            # 真实客户端 IP 在 CF-Connecting-IP 里；$remote_addr 只是 docker 网关
            proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            # 写死 https：$scheme 在这里是 http，后端据此生成绝对 URL 或设
            # secure cookie 时会错。浏览器侧实际就是 https。
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }

        # 前端 SPA
        location / {
            proxy_pass         http://host.docker.internal:8888;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $http_cf_connecting_ip;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
