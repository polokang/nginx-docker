events {
    worker_connections 1024;
}

http {
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ── TLS 安全默认 ────────────────────────────────────────────────────
    ssl_protocols              TLSv1.2 TLSv1.3;
    ssl_ciphers                HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers  on;
    ssl_session_cache          shared:SSL:10m;
    ssl_session_timeout        1d;

    # ─────────────────────────────────────────────────────────────────────
    # 当前域名策略：
    #   pro.aquareporter.com.au     → HTTPS（Passkey 需要 secure context）
    #   aquadev.aquareporter.com.au → HTTP-only（内网 adminpage 不需要 TLS）
    #
    # 仅当 ./certs/live/pro.aquareporter.com.au/{fullchain,privkey}.pem 已经
    # 存在时这份配置才能启动。首次签发前先用 nginx.bootstrap.conf（或临时把
    # 443 server 块注释掉）。
    # ─────────────────────────────────────────────────────────────────────

    # ── HTTP: pro → ACME challenge + 301 到 HTTPS ───────────────────────
    server {
        listen 80;
        server_name pro.aquareporter.com.au;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            default_type "text/plain";
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------
    # HTTP: aquadev.aquareporter.com.au  ->  adminpage (8000)
    # 内网访问，不做 TLS 终结，不强制跳转 HTTPS。
    # -------------------------------------------------------
    server {
        listen 80;
        server_name aquadev.aquareporter.com.au;

        location / {
            proxy_pass         http://host.docker.internal:8000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }

    # -------------------------------------------------------
    # HTTPS: pro.aquareporter.com.au
    #   /api/*  -> aquareporter-api (8088)
    #   /*      -> aquareporter-web (8888)
    # 让浏览器只对同源 https 端口发请求，避免 Mixed Content。
    # -------------------------------------------------------
    server {
        listen 443 ssl;
        http2  on;
        server_name pro.aquareporter.com.au;

        ssl_certificate     /etc/letsencrypt/live/pro.aquareporter.com.au/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/pro.aquareporter.com.au/privkey.pem;

        # 后端 API
        location /api/ {
            proxy_pass         http://host.docker.internal:8088;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }

        # 前端 SPA
        location / {
            proxy_pass         http://host.docker.internal:8888;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_read_timeout 60s;
        }
    }
}
